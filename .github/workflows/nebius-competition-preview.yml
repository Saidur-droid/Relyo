name: Nebius Competition Judge Preview

on:
  push:
    branches:
      - competition/relyo-2026
    paths:
      - ".competition-nebius-preview-trigger"
      - ".github/workflows/nebius-competition-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relyo-nebius-competition-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_BsJXXtOBNmww7MhlgiE7JzzO
      VERCEL_PROJECT_ID: prj_GdpW8gbUqsjZx84AtoHq2twAl7gi
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::Missing VERCEL_TOKEN"; exit 1; }
          test -n "${NEBIUS_API_KEY:-}" || { echo "::error::Missing NEBIUS_API_KEY"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Validate Vercel project access
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/vercel-project.json --write-out "%{http_code}" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::VERCEL_TOKEN cannot read project $VERCEL_PROJECT_ID in $VERCEL_ORG_ID (HTTP $STATUS)."
            exit 1
          fi
          echo "Vercel project access validated."
      - name: Link Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull preview environment
        shell: bash
        run: |
          pnpm dlx vercel@latest pull --yes --environment=preview --git-branch=competition/relyo-2026 --token="$VERCEL_TOKEN"
      - name: Build competition preview
        shell: bash
        run: |
          pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
      - name: Deploy judge preview with Nebius runtime secret
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(
            pnpm dlx vercel@latest deploy               --prebuilt               --yes               --archive=tgz               --token="$VERCEL_TOKEN"               --env "NEBIUS_API_KEY=$NEBIUS_API_KEY"               --no-color | tail -n 1
          )"
          case "$URL" in
            https://*.vercel.app) ;;
            *) echo "::error::Unexpected deployment URL: $URL"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify judge URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          curl -fsS --retry 8 --retry-all-errors --retry-delay 5 "$URL/" >/tmp/root.html
      - name: Record judge preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo "## Nebius competition judge preview"
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Preview URL: $URL"
            echo "- Model: nvidia/Nemotron-3_5-Lightning"
            echo "- Nebius runtime secret: configured server-side"
          } >> "$GITHUB_STEP_SUMMARY"
