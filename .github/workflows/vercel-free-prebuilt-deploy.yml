name: Vercel Free Prebuilt Production Deploy

on:
  push:
    branches: [main]
    paths:
      - ".vercel-prebuilt-deploy-trigger"
      - ".github/workflows/vercel-free-prebuilt-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relyo-vercel-prebuilt-production
  cancel-in-progress: false

jobs:
  deploy:
    name: build on GitHub and upload prebuilt output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_BsJXXtOBNmww7MhlgiE7JzzO
      VERCEL_PROJECT_ID: prj_GdpW8gbUqsjZx84AtoHq2twAl7gi
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Require project-scoped Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN. Create a free project-scoped Vercel token and add it as repository secret VERCEL_TOKEN."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Validate token can read configured Vercel project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_STATUS="$(
            curl --silent --show-error               --output /tmp/vercel-project.json               --write-out "%{http_code}"               --header "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          )"

          if [ "$PROJECT_STATUS" != "200" ]; then
            echo "::error::Stored VERCEL_TOKEN cannot read configured project $VERCEL_PROJECT_ID in $VERCEL_ORG_ID (HTTP $PROJECT_STATUS). The secret exists, but its project/account access does not match this production project or has been revoked."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const project = JSON.parse(fs.readFileSync("/tmp/vercel-project.json", "utf8"));
          const expectedProject = process.env.VERCEL_PROJECT_ID;
          const expectedOrg = process.env.VERCEL_ORG_ID;

          if (project.id !== expectedProject) {
            throw new Error(`Vercel project mismatch: expected ${expectedProject}, received ${project.id ?? "missing"}`);
          }

          if (project.accountId && project.accountId !== expectedOrg) {
            throw new Error(`Vercel account mismatch: expected ${expectedOrg}, received ${project.accountId}`);
          }

          console.log("Configured Vercel project is readable by the stored token.");
          NODE

      - name: Create explicit local Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node <<'NODE'
          const fs = require("node:fs");
          const link = {
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          };
          fs.writeFileSync(".vercel/project.json", JSON.stringify(link, null, 2) + "\n");
          NODE

      - name: Pull production project settings and environment
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@latest pull             --yes             --environment=production             --token="$VERCEL_TOKEN"

      - name: Build Vercel output on free GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@latest build             --prod             --token="$VERCEL_TOKEN"

      - name: Upload prebuilt output directly to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(
            pnpm dlx vercel@latest deploy               --prebuilt               --prod               --yes               --archive=tgz               --token="$VERCEL_TOKEN"               --no-color | tail -n 1
          )"
          case "$DEPLOYMENT_URL" in
            https://*.vercel.app) ;;
            *)
              echo "::error::Unexpected Vercel deployment URL: $DEPLOYMENT_URL"
              exit 1
              ;;
          esac
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public production URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/" >/tmp/relyo-root.html
          curl -fsS --retry 8 --retry-all-errors --retry-delay 5 "https://relyo-two.vercel.app/" >/tmp/relyo-stable-root.html

      - name: Record deployment evidence
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Free prebuilt Vercel production deployment"
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Build executor: standard GitHub-hosted ubuntu-latest"
            echo "- Vercel remote build: bypassed by prebuilt upload"
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo "- Stable production URL: https://relyo-two.vercel.app"
            echo "- Vercel project: $VERCEL_PROJECT_ID"
            echo "- Paid Vercel upgrade: not required by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
