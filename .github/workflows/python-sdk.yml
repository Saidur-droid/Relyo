name: Python SDK

on:
  pull_request:
    paths:
      - "sdks/python/**"
      - ".github/workflows/python-sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/python-sdk.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s sdks/python/tests
        env:
          PYTHONPATH: sdks/python
