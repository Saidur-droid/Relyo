[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relyo"
version = "0.1.0"
description = "Python SDK for the Relyo Proof API"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }

[tool.setuptools.packages.find]
where = ["."]
include = ["relyo*"]
